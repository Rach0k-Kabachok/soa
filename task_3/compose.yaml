name: flight-booking

x-postgres: &postgres
  image: postgres:17-alpine
  environment:
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app
    POSTGRES_DB: app
  healthcheck:
    test: [CMD-SHELL, "pg_isready -U app -d app"]
    interval: 2s
    timeout: 2s
    retries: 30

services:
  flight-db:
    <<: *postgres
    volumes:
      - flight-data:/var/lib/postgresql/data

  booking-db:
    <<: *postgres
    volumes:
      - booking-data:/var/lib/postgresql/data

  redis-master:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes", --replica-announce-ip, redis-master]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30

  redis-replica:
    image: redis:7.4-alpine
    command: [redis-server, --replicaof, redis-master, "6379", --appendonly, "yes", --replica-announce-ip, redis-replica]
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30

  sentinel:
    image: redis:7.4-alpine
    command: [sh, -c, "cp /etc/redis/sentinel.conf /data/sentinel.conf && exec redis-server /data/sentinel.conf --sentinel"]
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf:ro
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica:
        condition: service_healthy
    healthcheck:
      test: [CMD, redis-cli, -p, "26379", ping]
      interval: 2s
      timeout: 2s
      retries: 30

  flight:
    build: .
    command: [/app/flight]
    environment:
      DATABASE_URL: postgres://app:app@flight-db:5432/app?sslmode=disable
      GRPC_API_KEY: ${GRPC_API_KEY:-local-homework-key}
      REDIS_MASTER_NAME: flights
      REDIS_SENTINELS: sentinel:26379
    ports:
      - "${FLIGHT_PORT:-50051}:50051"
    depends_on:
      flight-db:
        condition: service_healthy
      sentinel:
        condition: service_healthy

  booking:
    build: .
    command: [/app/booking]
    environment:
      DATABASE_URL: postgres://app:app@booking-db:5432/app?sslmode=disable
      GRPC_API_KEY: ${GRPC_API_KEY:-local-homework-key}
      FLIGHT_ADDR: flight:50051
      GRPC_ATTEMPT_TIMEOUT: ${GRPC_ATTEMPT_TIMEOUT:-1s}
      CB_FAILURE_THRESHOLD: ${CB_FAILURE_THRESHOLD:-5}
      CB_OPEN_TIMEOUT: ${CB_OPEN_TIMEOUT:-10s}
      CB_WINDOW: ${CB_WINDOW:-30s}
    ports:
      - "${BOOKING_PORT:-8080}:8080"
    depends_on:
      booking-db:
        condition: service_healthy
      flight:
        condition: service_started

volumes:
  flight-data:
  booking-data:
